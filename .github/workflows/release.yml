name: release

# Three ways in:
#   * called by bump.yml after a label-driven version bump (the normal path);
#   * a tag you push by hand (a human push DOES trigger this);
#   * workflow_dispatch with no tag - builds the artifacts without publishing, to test the workflow.
on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and publish, e.g. v0.2.0"
        required: true
        type: string
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish; leave empty to build only"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Everything that can reject a bad tag in seconds, before a ~10 minute Windows build.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out into a folder named f1telemetry
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: f1telemetry          # absolute imports are f1telemetry.src.* and the PyInstaller
                                     # spec puts this folder's PARENT on pathex - the name matters
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Version files agree, and match the tag
        working-directory: f1telemetry
        env:
          IS_RELEASE: ${{ inputs.tag != '' || github.ref_type == 'tag' }}
        run: |
          if [ "$IS_RELEASE" = "true" ]; then
            python packaging/check_version.py "$TAG"
          else
            python packaging/check_version.py
          fi

      - name: Release notes exist for this tag
        if: inputs.tag != '' || github.ref_type == 'tag'
        working-directory: f1telemetry
        run: python packaging/release_notes.py "$TAG" -o "${{ github.workspace }}/notes.md"

      - name: Install runtime deps (for the test suite)
        working-directory: f1telemetry
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1

      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen        # headless runner; the UI tests need a platform plugin
        run: python -m unittest discover -s f1telemetry/test -t .

      - name: Upload the release notes
        if: inputs.tag != '' || github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md

  # The PDF is built on Linux, not on the Windows runner: pandoc alone cannot emit a PDF, and a
  # TeX install is far cheaper and more predictable here. The guide uses -> and em-dashes, so the
  # engine must be xelatex with a unicode font (Latin Modern silently drops the arrows).
  guide-pdf:
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install pandoc + xelatex
        run: |
          sudo apt-get update
          # Both extras are only *Recommends* of texlive-xetex, so --no-install-recommends drops
          # them, and each fails the build with an error naming a font rather than a package:
          #   texlive-fonts-recommended -> pzdr.tfm (ZapfDingbats), used by hyperref's xetex driver
          #   lmodern                   -> lmodern.sty, loaded unconditionally by pandoc's template
          # fontspec/unicode-math need no line: texlive-xetex -> -latex-extra -> -latex-recommended.
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-fonts-recommended lmodern fonts-dejavu
      - name: Build USER_GUIDE.pdf
        run: |
          pandoc docs/USER_GUIDE.md -o USER_GUIDE.pdf \
            --pdf-engine=xelatex \
            --toc \
            -V geometry:margin=2.5cm \
            -V mainfont="DejaVu Serif" \
            -V monofont="DejaVu Sans Mono" \
            -V colorlinks=true
      - uses: actions/upload-artifact@v4
        with:
          name: user-guide-pdf
          path: USER_GUIDE.pdf

  windows-build:
    runs-on: windows-latest
    needs: [preflight, guide-pdf]
    steps:
      - name: Check out into a folder named f1telemetry
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: f1telemetry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"      # matches the boot the verified builds were made on

      - name: Install the app + PyInstaller
        working-directory: f1telemetry
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[package]"

      - name: Build the one-folder bundle
        working-directory: f1telemetry
        run: pyinstaller packaging/f1telemetry.spec --noconfirm

      # Beside the exe, NOT inside _internal/ - see paths.app_dir() and the Help page's
      # "Open user guide" action. A tester who never launches the app still finds the guide.
      - name: Add the user guide beside the exe
        uses: actions/download-artifact@v4
        with:
          name: user-guide-pdf
          path: f1telemetry/dist/f1telemetry

      - name: Add the roster template beside the exe
        working-directory: f1telemetry
        shell: pwsh
        run: Copy-Item docs/roster_template.csv dist/f1telemetry/
      
      # LGPL v3 notice (Qt/PySide6) requires the licence notice to reach whoever gets the binary, so
      # these ship beside the exe like the guide - not buried in _internal/.
      - name: Add the licence notice beside the exe
        working-directory: f1telemetry
        shell: pwsh
        run: |
          Copy-Item LICENSE dist/f1telemetry
          Copy-Item NOTICE.md dist/f1telemetry

      - name: Sanity-check the bundle
        working-directory: f1telemetry/dist/f1telemetry
        shell: pwsh
        run: |
          foreach ($item in "f1telemetry.exe", "_internal", "USER_GUIDE.pdf", "roster_template.csv", "LICENSE", "NOTICE.md") {
            if (-not (Test-Path $item)) { throw "missing from the bundle: $item" }
          }

      # 7-Zip is preinstalled on the runner and is minutes faster than Compress-Archive on a
      # bundle this size (thousands of files, ~250 MB).
      - name: Zip the build
        working-directory: f1telemetry/dist
        shell: pwsh
        run: |
          $safe = $env:TAG -replace '/', '-'
          7z a -tzip "f1telemetry-${safe}-windows-x64.zip" f1telemetry

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: f1telemetry/dist/*.zip
  
  # Best-effort Linux artifact (PRIORITIES C8a). Deliberately a tarball, not an AppImage:
  # A .tar.gz rather than a zip because zip does not preservere the executable bit, so a zip
  # would need a chmod +x before the binary would run at all.
  # KNOWN LIMIT: do not file as a bug: a PyInstaller bundle links against the glibc of the machine
  # that built it, so this artifact needs a distro at least as new as the runner's Ubuntu. Building
  # for older distros means an older container, which is not worth it for a best-effort artifact.
  linux-build:
    runs-on: ubuntu-latest
    needs: [preflight, guide-pdf]
    steps:
      - name: Check out into a folder named f1telemetry
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: f1telemetry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      
      - name: Install the app + PyInstaller
        working-directory: f1telemetry
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[package]"
          # Qt needs these to link at build time; the runner image does not carry them all.
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1
      
      - name: Build the one-folder bundle
        working-directory: f1telemetry
        env:
          # Any Qt import during PyInstaller's collection must not reach for a display: the runner
          # has none, and Qt aborts the process rather than raising. Same reason ci.yml sets it
          # for the test suite. The spec's filter is the real fix; this covers the next submodule
          # that decides to touch Qt at import time.
          QT_QPA_PLATFORM: offscreen
        run: pyinstaller packaging/f1telemetry.spec --noconfirm

      # Beside the binary, NOT inside _internal/ - paths.app_dir() resolves here, and the Help 
      # page's "Open user guide" / "Licences & notices" actions read from it.cancel-timeout-minutes: 
      - name: Add the user guide beside the binary
        uses: actions/download-artifact@v4
        with:
          name: user-guide-pdf
          path: f1telemetry/dist/f1telemetry

      - name: Add the roster template, licence and notices beside the binary
        working-directory: f1telemetry
        run: cp docs/roster_template.csv LICENSE NOTICE.md dist/f1telemetry/
      
      # same set the Windows job checks. LICENSE + NOTICE.md are an LGPL v3 obligation for the bundled
      # Qt, so a missing one must fail the build rather than ship quietly.
      - name: Sanity-check the bundle
        working-directory: f1telemetry/dist/f1telemetry
        run: |
          for item in f1telemetry _internal USER_GUIDE.pdf roster_template.csv LICENSE NOTICE.md; do
            { -e "$item" ] || (echo "missing from the bundle: $item"; exit 1); }
          done

      # -C dist so t he archive holds f1telemetry/... rather than the full path.cancel-timeout-minutes: 
      - name: Tar the build
        working-directory: f1telemetry
        run: |
          # On a no-tag workflow_dispatch, TAG is the branch name - and branch names contain
          # slashes, which would be read as a directory in the output path. Only bites on dispatch
          # test runs; a real release passes a v-tag with no slash.
          safe="${TAG//\//-}"
          tar -czf "dist/f1telemetry-${safe}-linux-x64.tar.gz" -C dist f1telemetry
      
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: f1telemetry/dist/*.tar.gz

  release:
    runs-on: ubuntu-latest
    needs: [guide-pdf, windows-build, linux-build]
    if: inputs.tag != '' || github.ref_type == 'tag'
    permissions:
      contents: write            # creating the Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # A FULL release, deliberately: GitHub's /releases/latest skips drafts and prereleases, and
      # the in-app update check reads exactly that endpoint (src/update_check.py).
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" \
            --title "F1 Telemetry $TAG" \
            --notes-file artifacts/release-notes/notes.md \
            artifacts/windows-zip/*.zip \
            artifacts/linux-tarball/*.tar.gz \
            artifacts/user-guide-pdf/USER_GUIDE.pdf
