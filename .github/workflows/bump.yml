name: bump

# Release preparation, staging-flow edition. main is never pushed to by CI.
#
# Label the staging -> main PR major/minor/patch and the bump commit lands on `staging`, so the
# version files + closed changelog section arrive in main through the PR itself. The tag and the
# GitHub Release then happen on the merge - see tag.yml.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      level:
        description: "Bump level - use when no PR label applies (e.g. the very first release)"
        required: true
        type: choice
        options: [major, minor, patch]
      branch:
        description: "Branch to bump (the release PR's head)"
        required: false
        default: staging
        type: string

concurrency:
  group: release-bump
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump:
    # Only the release PR prepares a release. A labelled PR into staging must do nothing -
    # without this guard it would bump on the wrong merge entirely.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.base.ref == 'main' && github.head_ref == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write            # pushes the bump commit to the PR's head branch
    steps:
      - name: Resolve the bump level
        id: level
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          DISPATCH_LEVEL: ${{ inputs.level }}
        run: |
          level="$DISPATCH_LEVEL"
          if [ -z "$level" ]; then
            for candidate in major minor patch; do        # highest wins if several are set
              if printf '%s' "$LABELS" | grep -q "\"$candidate\""; then level="$candidate"; break; fi
            done
          fi
          echo "level=$level" >> "$GITHUB_OUTPUT"
          if [ -n "$level" ]; then
            echo "Preparing: $level"
          else
            echo "No major/minor/patch label - nothing to prepare."
          fi

      # The branch itself, NOT the PR merge commit: the guard below reads the branch tip's subject.
      - name: Check out the release branch
        if: steps.level.outputs.level != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || inputs.branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.level.outputs.level != ''
        with:
          python-version: "3.14"

      # Labels get removed and re-added; a second bump would double the version. Keyed on the
      # changelog/version pair rather than the tip commit subject, so a merge landing after the
      # bump can't hide the release commit (tag.yml keys on the version file for the same reason).
      - name: Skip if this branch already carries its release commit
        id: guard
        if: steps.level.outputs.level != ''
        run: |
          if python packaging/bump_version.py --is-prepared; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump the version files, close the changelog section, push to the PR branch
        if: steps.level.outputs.level != '' && steps.guard.outputs.done != 'true'
        run: |
          version=$(python packaging/bump_version.py "${{ steps.level.outputs.level }}")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/version.py pyproject.toml CHANGELOG.md
          git commit -m "chore(release): v$version"
          git push origin HEAD:"${{ github.head_ref || inputs.branch }}"
