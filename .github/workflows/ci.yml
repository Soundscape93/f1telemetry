name: ci

on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled included so the changelog gate re-runs when you add a bump label to an
    # already-open PR.
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out into a folder named f1telemetry
        uses: actions/checkout@v4
        with:
          path: f1telemetry          # the suite imports f1telemetry.src.* from the parent dir
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        working-directory: f1telemetry
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1
      - name: Version files agree
        working-directory: f1telemetry
        run: python packaging/check_version.py
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s f1telemetry/test -t .

  # Only PRs that will actually cut a release must carry release notes.
  changelog:
    if: >-
      github.event_name == 'pull_request' &&
      (contains(github.event.pull_request.labels.*.name, 'major') ||
       contains(github.event.pull_request.labels.*.name, 'minor') ||
       contains(github.event.pull_request.labels.*.name, 'patch'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}      # the branch tip, not the merge commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: The unreleased section is release-ready
        run: |
          # Once bump.yml has run, those notes have moved into the new version's section and
          # Unreleased is deliberately empty again - re-checking it here would fail the release PR.
          if git log -1 --pretty=%s | grep -q '^chore(release):'; then
            echo "Already prepared: $(git log -1 --pretty=%s)"
            exit 0
          fi
          python packaging/bump_version.py --check
  # GitHub can restrict who merges into main, but not which branch the PR comes from.
  # Mark this check required on main to make "only staging merges to main" enforcaeable.
  source-branch:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Only staging may merge to main
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "staging" ]; then
            echo "PRs into main must come from staging (this one is from '$HEAD_REF')."
            exit 1
          fi
  # The guide PDF used to build only during a release, so one missing TeX package took a release
  # down with the tag already pushed. Building it here costs ~2 min (nearly all apt) and fails on
  # the PR instead. Keep the two steps in sync with release.yml's guide-pdf job.
  guide-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pandoc + xelatex
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-fonts-recommended lmodern fonts-dejavu
      - name: Build USER_GUIDE.pdf
        run: |
          pandoc docs/USER_GUIDE.md -o USER_GUIDE.pdf \
            --pdf-engine=xelatex \
            --toc \
            -V geometry:margin=2.5cm \
            -V mainfont="DejaVu Serif" \
            -V monofont="DejaVu Sans Mono" \
            -V colorlinks=true
      - uses: actions/upload-artifact@v4      # download it from the PR to eyeball the arrows
        with:
          name: user-guide-pdf-preview
          path: USER_GUIDE.pdf
